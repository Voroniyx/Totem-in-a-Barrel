name: Master

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Publish GitHub release
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Fabric mod
        if: steps.check.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: fabric-mod
          path: dist/fabric

      - name: Download Paper plugin
        if: steps.check.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: paper-plugin
          path: dist/paper

      - name: Prepare release assets
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-assets
          cp dist/fabric/*.jar "release-assets/DeathTotem-fabric-${VERSION}.jar"
          cp dist/paper/*.jar "release-assets/DeathTotem-paper-${VERSION}.jar"

      - name: Create GitHub release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            release-assets/*.jar

  deployment:
    name: Record deployment status
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Report build result as a deployment
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const ok = process.env.BUILD_RESULT === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'build',
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              description: 'CI build of master',
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: ok ? 'success' : 'failure',
              description: ok ? 'Build completed successfully' : 'Build failed',
              log_url: runUrl,
              environment_url: runUrl,
            });
